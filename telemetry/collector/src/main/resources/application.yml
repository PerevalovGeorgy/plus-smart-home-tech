spring:
  application:
    name: collector

server:
  port: 8080

kafka:
  bootstrap-servers: localhost:9092
  schema-registry-url: http://localhost:8081
  topics:
    sensors: telemetry.sensors.v1
    hubs: telemetry.hubs.v1

logging:
  level:
    root: INFO
    ru.yandex.practicum.telemetry: DEBUG
    org.apache.kafka.clients.producer: INFO
    io.confluent.kafka.serializers: DEBUG