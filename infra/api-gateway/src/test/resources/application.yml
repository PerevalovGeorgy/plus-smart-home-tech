spring:
  cloud:
    config:
      enabled: false
    gateway:
      routes: []
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:5173
              - http://localhost:3000
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600

eureka:
  client:
    enabled: false

