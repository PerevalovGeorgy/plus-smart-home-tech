spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    openfeign:
      client:
        config:
          default: # название сервиса в @FeignClient
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: NONE
          inventory-service:
            connectTimeout: 3000
            readTimeout: 3000
            loggerLevel: BASIC

logging:
  level:
    ru.yandex.practicum.order.feign.InventoryClient: DEBUG
    ru.yandex.practicum.order.feign.ProductClient: INFO

server:
  port: 0